[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "predaudit"
version = "0.0.1"
description = "Auditing built-in success predicates of simulated manipulation benchmarks"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["predaudit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
